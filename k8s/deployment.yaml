apiVersion: apps/v1
kind: Deployment
metadata:
  name: lastone
  namespace: lastone
  labels:
    app: lastone
    app.kubernetes.io/managed-by: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lastone
  template:
    metadata:
      labels:
        app: lastone
    spec:
      containers:
        - name: lastone
          image: nginx:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
